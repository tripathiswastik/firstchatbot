name: CI & Security Quality Gate

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  security-and-lint:
    name: Secret Scan & Python Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: TruffleHog Secret Scanning
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Lint Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff bandit

      - name: Static Security Analysis (SAST)
        run: |
          bandit -r . -f custom --msg-template "{abspath}:{line}: {test_id}[bandit]: {severity}: {msg}" -ll || true

      - name: Linter & AST Syntax Validation
        run: |
          ruff check . --select=E9,F63,F7,F82 --show-source
